<script>
'use strict';
const WORLDS={
 suma:{name:'BOSQUE DE LAS SUMAS',short:'SUMAS',verb:'SUMAR',icon:'🍎',symbol:'+',theme:'#ffa7c6',pale:'#fff0f7',worldEmoji:'🌳',objects:['🍎','🍐','🍊'],story:'Ayudá a juntar frutas para la gran fiesta del bosque.',target:'CARRITO',source:'CANASTA'},
 resta:{name:'TORRE DE LAS RESTAS',short:'RESTAS',verb:'RESTAR',icon:'🍪',symbol:'−',theme:'#ffd77c',pale:'#fff8df',worldEmoji:'🏰',objects:['🍪','🧁','🍩'],story:'Sacá las golosinas que se llevaron los duendes.',target:'CAJA',source:'MESA'},
 mult:{name:'JARDÍN DE LOS GRUPOS',short:'MULTIPLICACIONES',verb:'MULTIPLICAR',icon:'🌸',symbol:'×',theme:'#9dbbff',pale:'#edf2ff',worldEmoji:'🌷',objects:['🌸','🌼','🌺'],story:'Armá macetas con la misma cantidad de flores.',target:'MACETA',source:'SEMILLERO'},
 div:{name:'ISLA DEL REPARTO',short:'DIVISIONES',verb:'DIVIDIR',icon:'💎',symbol:'÷',theme:'#94edce',pale:'#e8fff8',worldEmoji:'🏝️',objects:['💎','🪙','🍬'],story:'Repartí los tesoros para que todos reciban lo mismo.',target:'COFRE',source:'TESOROS'}
};
const DIFFICULTIES={explorador:{label:'🌱 EXPLORADOR',max:10},aventurero:{label:'🚀 AVENTURERO',max:20},experto:{label:'🏆 EXPERTO',max:36}};
const SAVE_KEY='numi-mateaventura-v1';const ZERO={suma:0,resta:0,mult:0,div:0};
function load(){
 try {
  const p=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')||{};
  return {
   progress:Object.fromEntries(Object.keys(ZERO).map(k=>[k,Math.min(3,Math.max(0,Number(p.progress&&p.progress[k])||0))])),
   stars:Math.max(0,Number(p.stars)||0),
   streak:Math.max(0,Number(p.streak)||0),
   prefs:{caps:true,large:false,sound:true,autoVoice:false,...(p.prefs||{})}
  };
 } catch(e){
  return {progress:{...ZERO},stars:0,streak:0,prefs:{caps:true,large:false,sound:true,autoVoice:false}};
 }
}
const initial=load();const S={screen:'intro',op:'suma',level:'explorador',mission:0,board:null,selected:null,stage:'arrange',hint:'',feedback:'',feedbackType:'',wrong:null,winEarned:false,fromRest:null,...initial};
let nextID=0,voiceID=0,audioContext=null,drag=null,suppressClickUntil=0;const app=document.getElementById('app'),modalRoot=document.getElementById('modal-root');
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));const count=(key)=>S.board.items.filter(x=>x.zone===key).length;const allCompleted=()=>Object.values(S.progress).reduce((a,b)=>a+b,0);
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({progress:S.progress,stars:S.stars,streak:S.streak,prefs:S.prefs}))}catch(e){}}
function applyPrefs(){document.body.classList.toggle('caps',S.prefs.caps);document.body.style.setProperty('--big',S.prefs.large?'1.15':'1');}
function mascot(cls='numi'){return `<svg class="${cls}" viewBox="0 0 240 255" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Numi, un robot amistoso con ojos grandes y sonrisa">
<ellipse cx="120" cy="244" rx="76" ry="10" fill="#151342" opacity=".2"/><path d="M83 183v38m69-38v38" stroke="#6f62c7" stroke-width="19" stroke-linecap="round"/><rect x="59" y="213" width="54" height="25" rx="12" fill="#ffc957" stroke="#352a67" stroke-width="5"/><rect x="129" y="213" width="54" height="25" rx="12" fill="#ffc957" stroke="#352a67" stroke-width="5"/>
<path d="M52 122Q16 111 19 75" stroke="#81e8e3" stroke-width="21" fill="none" stroke-linecap="round"/><circle cx="18" cy="73" r="15" fill="#ffd168" stroke="#30245f" stroke-width="4"/><path d="M187 119Q220 109 216 71" stroke="#81e8e3" stroke-width="21" fill="none" stroke-linecap="round"/><circle cx="216" cy="68" r="15" fill="#ffd168" stroke="#30245f" stroke-width="4"/>
<rect x="42" y="95" width="153" height="114" rx="43" fill="#8b6dea" stroke="#352563" stroke-width="7"/><rect x="78" y="123" width="85" height="65" rx="15" fill="#6452b9"/>
<rect x="87" y="132" width="29" height="21" rx="5" fill="#ffe077"/><text x="101" y="150" font-size="22" fill="#3c2d65" font-weight="bold" text-anchor="middle">+</text><rect x="126" y="132" width="29" height="21" rx="5" fill="#91ffee"/><text x="140" y="150" font-size="22" fill="#3c2d65" font-weight="bold" text-anchor="middle">−</text><rect x="87" y="159" width="29" height="21" rx="5" fill="#ffb2ca"/><text x="101" y="178" font-size="22" fill="#3c2d65" font-weight="bold" text-anchor="middle">×</text><rect x="126" y="159" width="29" height="21" rx="5" fill="#b2daff"/><text x="140" y="178" font-size="22" fill="#3c2d65" font-weight="bold" text-anchor="middle">÷</text>
<rect x="34" y="30" width="169" height="111" rx="41" fill="#86e1ef" stroke="#352563" stroke-width="7"/><rect x="50" y="46" width="136" height="77" rx="30" fill="#f4ffff"/><ellipse cx="89" cy="80" rx="11" ry="16" fill="#31265b"/><ellipse cx="149" cy="80" rx="11" ry="16" fill="#31265b"/><circle cx="93" cy="72" r="4" fill="white"/><circle cx="153" cy="72" r="4" fill="white"/><ellipse cx="69" cy="101" rx="11" ry="5" fill="#ff9cc6"/><ellipse cx="169" cy="101" rx="11" ry="5" fill="#ff9cc6"/><path d="M106 103Q118 118 134 103" fill="none" stroke="#33245e" stroke-width="5" stroke-linecap="round"/><path d="M118 30V15" stroke="#352563" stroke-width="6"/><circle cx="118" cy="12" r="10" fill="#ffcf5a" stroke="#352563" stroke-width="4"/></svg>`}
function confetti(){if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#ffe079','#8cfbe9','#ff88be','#aaa3ff','#fff'];for(let i=0;i<36;i++){const el=document.createElement('span');el.className='cf';el.style.left=rand(0,99)+'vw';el.style.top='-20px';el.style.background=colors[i%colors.length];el.style.animationDuration=(1.4+Math.random()*2)+'s';el.style.animationDelay=(Math.random()*.4)+'s';document.body.append(el);setTimeout(()=>el.remove(),4000)}}
function tone(freq=500,length=.1){if(!S.prefs.sound)return;try{audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();const osc=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime;osc.type='sine';osc.frequency.setValueAtTime(freq,t);osc.frequency.exponentialRampToValueAtTime(Math.max(130,freq*.75),t+length);g.gain.setValueAtTime(.055,t);g.gain.exponentialRampToValueAtTime(.001,t+length);osc.connect(g);g.connect(audioContext.destination);osc.start(t);osc.stop(t+length)}catch(e){}}
function stopVoice(){voiceID++;if('speechSynthesis' in window)window.speechSynthesis.cancel()}
function speak(txt){if(!('speechSynthesis' in window))return;stopVoice();const now=voiceID,u=new SpeechSynthesisUtterance(txt);u.lang='es-AR';u.rate=.83;u.pitch=1.08;const voices=window.speechSynthesis.getVoices(),v=voices.find(v=>v.lang.toLowerCase()==='es-ar')||voices.find(v=>v.lang.toLowerCase().startsWith('es'));if(v)u.voice=v;u.onend=()=>{if(now!==voiceID)return};window.speechSynthesis.speak(u)}
function autoSay(txt){if(S.prefs.autoVoice)setTimeout(()=>speak(txt),180)}
function intro(){return `<section class="intro-scene"><div class="intro-copy"><span class="pill">✨ UNA AVENTURA PARA APRENDER JUGANDO</span><h1>¡HOLA!<br>SOY <span>NUMI</span> 🤖</h1><p>¡Me perdí en el mundo de los números! ¿Me ayudás a superar las 4 misiones mágicas?</p><div class="feature-row"><span class="mini-feature">👆 TOCÁ O ARRASTRÁ</span><span class="mini-feature">🔊 TE EXPLICO</span><span class="mini-feature">💡 TE AYUDO</span><span class="mini-feature">⭐ GANÁS ESTRELLAS</span></div><div class="intro-buttons"><button class="btn primary" data-action="map">🎮 ¡EMPEZAR AVENTURA!</button><button class="btn ghost" data-action="speak-intro">🔊 ESCUCHÁ A NUMI</button></div></div><div class="intro-visual"><div class="portal"></div><span class="planet a">➕</span><span class="planet b">⭐</span><span class="planet c">➗</span>${mascot()}</div></section><div class="intro-bottom"><span>💜 SIN TIEMPO LÍMITE</span><span>🔁 TODOS LOS INTENTOS QUE NECESITES</span><span>📱 CELULAR · TABLET · COMPUTADORA</span></div>`}
function mapPage(){return `<div class="map-head"><div><span class="pill">🗺️ EL MAPA DE NUMI</span><h1>Elegí un mundo para explorar</h1><p class="map-intro">Cada mundo tiene 3 desafíos. Tocá, mové y repartí objetos. ¡No necesitás apurarte!</p></div><button class="btn ghost small" data-action="passport">🏅 MI PASAPORTE</button></div><div class="level-line"><strong>🎯 DIFICULTAD:</strong>${Object.entries(DIFFICULTIES).map(([k,v])=>`<button class="level-btn" data-action="level" data-value="${k}" aria-pressed="${S.level===k}">${v.label}</button>`).join('')}</div><section class="path-grid" aria-label="Mundos de la aventura">${Object.entries(WORLDS).map(([key,o])=>`<article class="world" style="--world:${o.theme};--world-pale:${o.pale}"><div class="world-visual"><div class="world-circle" aria-hidden="true">${o.worldEmoji}</div><span class="world-operation" aria-hidden="true">${o.symbol}</span></div><div class="world-content"><span class="world-label">MUNDO ${Object.keys(WORLDS).indexOf(key)+1} · ${o.verb}</span><h2>${o.name}</h2><p>${o.story}</p><div class="world-stars" aria-label="${S.progress[key]} de 3 estrellas">${'⭐'.repeat(S.progress[key])}${'☆'.repeat(3-S.progress[key])}</div><button class="btn purple full" data-action="start" data-op="${key}">${S.progress[key]===3?'🎮 JUGAR OTRA VEZ':'🚀 '+(S.progress[key]?'CONTINUAR MISIÓN':'ENTRAR AL MUNDO')}</button></div></article>`).join('')}</section><p class="map-footnote">🌟 LAS MISIONES SE GUARDAN EN ESTE DISPOSITIVO. PODÉS VOLVER CUANDO QUIERAS.</p>`}
const SAMPLE={
explorador:{suma:[[3,2],[4,3],[6,4]],resta:[[6,2],[8,3],[10,4]],mult:[[2,2],[3,2],[2,4]],div:[[6,2],[8,2],[9,3]]},
aventurero:{suma:[[7,5],[9,8],[12,6]],resta:[[13,5],[17,9],[20,7]],mult:[[3,3],[3,4],[4,4]],div:[[12,3],[16,4],[18,3]]},
experto:{suma:[[15,12],[18,9],[17,15]],resta:[[26,9],[32,14],[35,18]],mult:[[4,5],[5,5],[5,6]],div:[[20,4],[24,6],[30,5]]}
};
function buildBoard(op,mission){const o=WORLDS[op],pair=SAMPLE[S.level][op][mission%3],emoji=o.objects[mission%3],items=[];const add=(zone,num,fixed)=>{for(let i=0;i<num;i++)items.push({id:++nextID,zone,fixed,emoji})};let n,answer,zones=[],goal,mode='move';const Z=(key,label,icon,cap=null)=>({key,label,icon,cap});
if(op==='suma'){n={a:pair[0],b:pair[1]};answer=n.a+n.b;zones=[Z('dest','CARRITO','🛒'),Z('origin','CANASTA','🧺')];add('dest',n.a,true);add('origin',n.b,false);goal=n.b}
if(op==='resta'){n={a:pair[0],b:pair[1]};answer=n.a-n.b;zones=[Z('origin','MESA','🍽️'),Z('dest','CAJA','📦',n.b)];add('origin',n.a,false);goal=n.b}
if(op==='mult'){n={groups:pair[0],each:pair[1]};answer=n.groups*n.each;zones=[...Array(n.groups)].map((_,i)=>Z('g'+i,'MACETA '+(i+1),'🪴',n.each)).concat(Z('origin','SEMILLERO','🌱'));add('origin',answer,false);goal=answer}
if(op==='div'){n={total:pair[0],groups:pair[1]};answer=n.total/n.groups;zones=[...Array(n.groups)].map((_,i)=>Z('g'+i,'COFRE '+(i+1),'🎁')).concat(Z('origin','TESOROS','💰'));add('origin',n.total,false);goal=n.total}
return {op,n,answer,zones,items,goal,emoji,initial:JSON.stringify(items),options:choices(answer),mode};}
function choices(a){const x=new Set([a]);for(let t=0;t<50&&x.size<4;t++){let v=a+rand(-5,5);if(v>=0&&v!==a)x.add(v)}let near=0;while(x.size<4){near++;x.add(a+near)}return [...x].sort(()=>Math.random()-.5)}
function instructions(){const b=S.board,n=b.n,o=WORLDS[S.op];if(S.stage==='answer')return '¡Muy bien! Ahora abrí el cofre que muestra la respuesta correcta.';if(S.op==='suma')return `En el carrito hay ${n.a} ${b.emoji}. Agregá ${n.b} de la canasta. ¿Cuántas hay en total?`;if(S.op==='resta')return `Hay ${n.a} ${b.emoji} en la mesa. Sacá ${n.b} y ponelas en la caja. ¿Cuántas quedan?`;if(S.op==='mult')return `Poné ${n.each} ${b.emoji} en cada una de las ${n.groups} macetas. ¿Cuántas hay en total?`;return `Repartí ${n.total} ${b.emoji} en ${n.groups} cofres, con la misma cantidad en cada uno. ¿Cuántas recibe cada cofre?`}
function hint(){const b=S.board,n=b.n;if(S.stage==='answer'){if(S.op==='suma')return `Contá las frutas del carrito. Son las que ya había más las que agregaste.`;if(S.op==='resta')return `Contá las que quedaron sobre la mesa, sin contar las de la caja.`;if(S.op==='mult')return `Podés contar todas las flores o sumar ${n.each} varias veces.`;return `Contá los objetos de UN solo cofre. Todos tienen que tener la misma cantidad.`}if(S.op==='suma')return `Primero tocá una fruta de la CANASTA. Después tocá el CARRITO. Repetí hasta mover ${n.b}.`;if(S.op==='resta')return `Tocá una galletita de la MESA y luego la CAJA. Mové ${n.b} en total.`;if(S.op==='mult')return `Empezá por la MACETA 1. Poné ${n.each} ${b.emoji}, después seguí con las otras.`;return `Repartí de a uno: primero un cofre, luego el siguiente. Si uno tiene más, podés mover objetos a otro.`}
function example(){const b=S.board;if(S.op==='suma')return {text:'Si tengo 2 manzanas y agrego 1, ahora tengo 3.',demo:'🍎🍎 + 🍎 = 3'};if(S.op==='resta')return {text:'Si tengo 4 galletitas y guardo 1, me quedan 3.',demo:'🍪🍪🍪🍪 − 🍪 = 3'};if(S.op==='mult')return {text:'Si tengo 2 macetas con 3 flores en cada una, hay 6 flores.',demo:'🌸🌸🌸 + 🌸🌸🌸 = 6'};return {text:'Si reparto 6 caramelos en 2 cofres iguales, cada uno recibe 3.',demo:'🍬🍬🍬 | 🍬🍬🍬 = 3'};}
function equation(reveal=false){const b=S.board,n=b.n,mark=reveal?b.answer:'?';if(S.op==='suma')return `${n.a} + ${n.b} = ${mark}`;if(S.op==='resta')return `${n.a} − ${n.b} = ${mark}`;if(S.op==='mult')return `${n.groups} × ${n.each} = ${mark}`;return `${n.total} ÷ ${n.groups} = ${mark}`}
function missionPage(){const b=S.board,o=WORLDS[S.op],done=organized();return `<div class="game-head"><div><div class="crumb">🗺️ ${o.name} · Misión ${S.mission+1} de 3</div><h1>${o.worldEmoji} ${o.verb} CON NUMI</h1></div><div><span class="mission-label">🎟️ MISIÓN ${S.mission+1}/3</span><div class="mission-track" aria-label="Progreso de misiones" style="margin-top:11px">${[0,1,2].map(i=>`<span class="dot ${i<S.mission?'done':i===S.mission?'current':''}"></span>`).join('')}</div></div></div><div class="game-container"><div class="guide">${mascot()}<div><small>🤖 NUMI TE DICE:</small><p>${instructions()}</p><p class="sub">👆 Tocá un objeto y después su destino. También podés arrastrarlo.</p></div></div><div class="support-bar"><button data-action="listen">🔊 REPETIR CONSIGNA</button><button data-action="help" class="${S.hint==='help'?'on':''}">👆 EXPLICAME</button><button data-action="hint" class="${S.hint==='hint'?'on':''}">💡 PISTA</button><button data-action="example" class="${S.hint==='example'?'on':''}">🎣 EJEMPLO</button><button data-action="rest">🌈 DESCANSO</button></div>${helpBox()}<div class="status"><div class="count-box">🧩 OBJETOS UBICADOS: <b>${movedCount()} / ${b.goal}</b></div><div class="equation" aria-label="Operación">${equation()}</div></div>${S.stage==='arrange'?`<div class="phase-note">${S.selected?'✨ ¡OBJETO ELEGIDO! AHORA TOCÁ SU DESTINO.':'✨ PRIMERO MOVÉ LOS OBJETOS. DESPUÉS ENCONTRÁ EL RESULTADO.'}</div>`:''}<div class="board ${S.stage==='answer'?'disabled':''}" aria-label="Área interactiva para organizar objetos">${b.zones.map(z=>zoneHTML(z)).join('')}</div>${S.stage==='answer'?answerHTML():''}${S.feedback?`<div class="feedback ${S.feedbackType}" role="status">${S.feedback}</div>`:''}<div class="game-actions">${S.stage==='arrange'?`<button class="btn mint" data-action="check-arrange">${done?'✨ ¡YA ESTÁ! COMPROBAR':'✅ REVISAR MI TRABAJO'}</button>`:''}<button class="btn white" data-action="undo">↶ DESHACER</button><button class="btn white" data-action="restart">🔁 REINICIAR</button><button class="btn white" data-action="map">🗺️ MAPA</button></div></div>`}
function helpBox(){if(!S.hint)return '';let title='',body='',demo='';if(S.hint==='help'){title='👆 NUMI TE MUESTRA CÓMO';body='1. Tocá un objeto que brille. 2. Tocá el lugar al que querés llevarlo. 3. Cuando termines, revisá tu trabajo.';demo=`${S.board.emoji} 👆 → ${S.op==='mult'?'🪴':S.op==='div'?'🎁':S.op==='suma'?'🛒':'📦'}`;}else if(S.hint==='hint'){title='💡 UNA PISTA PARA VOS';body=hint();}else{title='🎣 MIRÁ ESTE EJEMPLO';const ex=example();body=ex.text;demo=ex.demo}return `<div class="help-box"><strong>${title}</strong><p>${body}</p>${demo?`<div class="help-demo">${demo}</div>`:''}</div>`;}
function movedCount(){if(S.op==='suma'||S.op==='resta')return count('dest')-(S.op==='suma'?S.board.n.a:0);return S.board.goal-count('origin')}
function zoneHTML(z){const b=S.board,items=b.items.filter(x=>x.zone===z.key),isSource=z.key==='origin',avail=S.selected!==null&&S.stage==='arrange';const countDesc=(S.op==='div'&&!isSource)?`${items.length}`:`${items.length}${z.cap!==null?' / '+z.cap:''}`;return `<div class="zone ${!isSource?'target':''} ${avail?'available':''}" data-zone="${z.key}" tabindex="0" role="button" aria-label="${z.label}: ${items.length} objetos; tocá aquí para dejar el objeto seleccionado"><div class="zone-name"><span>${z.icon} ${z.label}</span><span class="counter">${countDesc}</span></div><div class="zone-items">${items.map(x=>`<button class="item ${x.fixed?'static':''} ${S.selected===x.id?'selected':''}" data-item="${x.id}" ${x.fixed?'disabled':''} aria-label="${x.emoji}, ${x.fixed?'objeto fijo':'objeto movible, tocar para seleccionar'}">${x.emoji}</button>`).join('')}</div>${S.selected!==null&&S.stage==='arrange'?'<span class="zone-hint">👆 TOCÁ AQUÍ PARA COLOCARLO</span>':items.length===0?'<span class="zone-hint">ESPACIO PARA PONER OBJETOS</span>':''}</div>`;}
function answerHTML(){return `<section class="answer-panel"><h2>🗝️ ¡ABRÍ EL COFRE CORRECTO!</h2><p>Contá y elegí el número que responde la operación.</p><div class="chests">${S.board.options.map(v=>`<button class="chest ${S.wrong===v?'wrong':''}" data-action="answer" data-value="${v}" aria-label="Cofre con número ${v}"><span class="chest-icon">🎁</span><strong>${v}</strong></button>`).join('')}</div></section>`;}
function organized(){const b=S.board,n=b.n;if(S.op==='suma')return count('origin')===0&&count('dest')===n.a+n.b;if(S.op==='resta')return count('dest')===n.b;if(S.op==='mult')return count('origin')===0&&b.zones.filter(z=>z.key!=='origin').every(z=>count(z.key)===n.each);return count('origin')===0&&new Set(b.zones.filter(z=>z.key!=='origin').map(z=>count(z.key))).size===1}
function selectItem(id){if(S.stage!=='arrange')return;const item=S.board.items.find(x=>x.id===id);if(!item||item.fixed)return;S.selected=(S.selected===id?null:id);S.feedback='';S.feedbackType='';tone(470,.07);render();}
function moveTo(key,id=S.selected){if(S.stage!=='arrange')return;const b=S.board,item=b.items.find(x=>x.id===id);const z=b.zones.find(z=>z.key===key);if(!item||item.fixed||!z)return;if(item.zone===key){S.selected=null;render();return;}if(S.op==='suma'&&key==='origin'){S.feedback='Para sumar, pasá las frutas de la canasta al carrito.';S.feedbackType='warn';tone(220);render();return}if(S.op==='resta'&&key==='origin'&&item.zone==='dest'){/* Permite corregir lo que se retiró */}if(z.cap!==null&&count(key)>=z.cap){S.feedback=`Ese lugar ya está completo. Probá con otro.`;S.feedbackType='warn';tone(230);render();return}const previousZone=item.zone;item.zone=key;S.selected=null;S.wrong=null;S.feedback='';S.feedbackType='';S.history.push({id:item.id,from:previousZone});tone(620,.08);render();}
function checkArrange(){if(organized()){S.stage='answer';S.selected=null;S.feedback='¡Lo organizaste! Ahora elegí la respuesta correcta para abrir el cofre.';S.feedbackType='ok';tone(880,.15);render();autoSay('¡Muy bien! Ahora abrí el cofre con la respuesta correcta.')}else{S.feedback=hint();S.feedbackType='warn';tone(230,.09);render();}}
function finishAnswer(value){const b=S.board;if(value!==b.answer){S.wrong=value;S.streak=0;S.feedback='¡Casi! No se abrió. Podés contar otra vez y elegir otro cofre. '+hint();S.feedbackType='warn';persist();tone(220,.18);render();return;}S.wrong=null;S.feedback='';S.streak++;const fresh=S.progress[S.op]<=S.mission;if(fresh){S.progress[S.op]=Math.max(S.progress[S.op],S.mission+1)}S.stars++;S.winEarned=true;persist();tone(750,.12);setTimeout(()=>tone(980,.18),130);S.screen='win';stopVoice();render();confetti();autoSay('¡Lo lograste! ¡Abriste el cofre matemático! ¡Ganaste una estrella!')}
function winPage(){const more=S.mission<2;const last=allCompleted()===12;return `<section class="win-screen"><div class="win-content"><div class="treasure" aria-hidden="true">🏆✨</div><span class="pill">⭐ ¡MISIÓN SUPERADA!</span><h1>¡LO LOGRASTE!</h1><p>¡Numi está feliz! Organizaste los objetos, pensaste y descubriste la respuesta.</p><div class="big-eq">${equation(true)}</div><p>⭐ ¡GANASTE UNA ESTRELLA! ${last?'🎉 ¡COMPLETASTE TODOS LOS MUNDOS!':''}</p><div class="win-actions"><button class="btn primary" data-action="next">${more?'🚀 SIGUIENTE MISIÓN':'🎡 OTRO MUNDO'}</button><button class="btn ghost" data-action="map">🗺️ IR AL MAPA</button><button class="btn ghost" data-action="passport">🏅 VER MIS ESTRELLAS</button></div></div></section>`}
function passportPage(){return `<div class="passport"><div class="passport-head"><span class="pill">🏅 MIS LOGROS</span><h1>EL PASAPORTE DE NUMI</h1><p>¡Mirá todo lo que aprendiste jugando!</p></div><div class="passport-card"><div class="passport-banner"><div>🌟 ESTRELLAS CONSEGUIDAS<br><span style="font-size:14px;color:#dad4ff">CADA COFRE ABIERTO CUENTA</span></div><strong>⭐ ${S.stars}</strong></div><div class="passport-worlds">${Object.entries(WORLDS).map(([key,o])=>`<div class="passport-world"><div>${o.worldEmoji} ${o.short}</div><div class="medals">${'⭐'.repeat(S.progress[key])}${'☆'.repeat(3-S.progress[key])}</div><span style="color:#615c7c;font-size:13px">${S.progress[key]} / 3 MISIONES</span></div>`).join('')}</div><div class="count-box">🔥 RACHA ACTUAL: <b>${S.streak}</b></div><p class="passport-foot">¡Todos los intentos valen! Tus logros quedan guardados en este navegador.</p><button class="btn purple full" data-action="map">🗺️ SEGUIR EXPLORANDO</button></div></div>`}
function render(){applyPrefs();document.getElementById('star-count').textContent=S.stars;document.getElementById('streak-count').textContent=S.streak;app.innerHTML=S.screen==='intro'?intro():S.screen==='map'?mapPage():S.screen==='game'?missionPage():S.screen==='win'?winPage():passportPage();}
function home(){stopVoice();S.screen='intro';S.selected=null;S.hint='';S.feedback='';closeModal();render();window.scrollTo(0,0)}
function map(){stopVoice();S.screen='map';S.selected=null;S.hint='';S.feedback='';closeModal();render();window.scrollTo(0,0)}
function start(op,mission){stopVoice();S.op=op;S.mission=mission;S.board=buildBoard(op,mission);S.history=[];S.stage='arrange';S.selected=null;S.feedback='';S.feedbackType='';S.wrong=null;S.hint='';S.screen='game';render();window.scrollTo(0,0);autoSay(instructions())}
function next(){if(S.mission<2){start(S.op,S.mission+1)}else map()}
function undo(){if(S.screen!=='game')return;if(S.stage==='answer'){S.stage='arrange';S.wrong=null}const b=S.board;const a=S.history.pop();if(a){const item=b.items.find(x=>x.id===a.id);if(item)item.zone=a.from||'origin'}S.selected=null;S.feedback='';render()}
function restart(){if(!S.board)return;start(S.op,S.mission)}
function help(action){S.hint=S.hint===action?'':action;S.feedback='';render();if(S.hint==='hint')speak(hint());if(S.hint==='example')speak(example().text)}
function showModal(html){modalRoot.innerHTML=`<div class="overlay" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="Panel de Numi"><button class="close" data-action="close-modal" aria-label="Cerrar">✕</button>${html}</div></div>`;const el=modalRoot.querySelector('.close');if(el)el.focus()}
function closeModal(){modalRoot.innerHTML=''}
function settings(){showModal(`<h2>⚙️ OPCIONES DE NUMI</h2><p>Ajustá el juego para que sea cómodo de leer y escuchar.</p>${[['caps','🔠 LETRAS EN MAYÚSCULA'],['large','🔎 LETRAS MÁS GRANDES'],['sound','🎵 SONIDOS DEL JUEGO'],['autoVoice','🔊 LEER CONSIGNAS AUTOMÁTICAMENTE']].map(([k,label])=>`<div class="settings-row"><label for="pref-${k}">${label}</label><button id="pref-${k}" data-action="pref" data-value="${k}" aria-pressed="${!!S.prefs[k]}">${S.prefs[k]?'SÍ ✓':'NO'}</button></div>`).join('')}<button class="btn purple full" data-action="test-voice" style="margin-top:20px">🔊 PROBAR VOZ DE NUMI</button><p style="font-size:13px">La voz usa las opciones disponibles en tu dispositivo.</p>`) }
function rest(){stopVoice();showModal(`<h2>🌈 TOMAMOS UN DESCANSO</h2><p>Numi se queda acá. No hay apuro, podés volver a jugar cuando quieras.</p><div class="rest-planet">🪐✨</div><p style="text-align:center;font-size:19px">¡Estirá los brazos, mirá a tu alrededor y volvé cuando tengas ganas!</p><div class="rest-buttons"><button class="btn mint" data-action="close-modal">▶ SEGUIR JUGANDO</button><button class="btn white" data-action="map">🗺️ IR AL MAPA</button></div>`) }
function handleAction(d){const a=d.action;if(a==='home')return home();if(a==='map')return map();if(a==='passport'){stopVoice();S.screen='passport';closeModal();render();window.scrollTo(0,0);return}if(a==='settings')return settings();if(a==='rest')return rest();if(a==='close-modal')return closeModal();if(a==='speak-intro')return speak('¡Hola! Soy Numi. Te acompaño a aprender las cuatro operaciones. Vamos a jugar sin apuro. Podés pedirme pistas, ejemplos y ayuda.');if(a==='level'){S.level=d.value;render();return}if(a==='start')return start(d.op,Math.min(S.progress[d.op],2));if(a==='next')return next();if(a==='listen')return speak(instructions());if(a==='help'||a==='hint'||a==='example')return help(a);if(a==='check-arrange')return checkArrange();if(a==='answer')return finishAnswer(Number(d.value));if(a==='undo')return undo();if(a==='restart')return restart();if(a==='pref'){const key=d.value;S.prefs[key]=!S.prefs[key];persist();applyPrefs();settings();return}if(a==='test-voice')return speak('Hola, soy Numi. ¡Vamos a aprender jugando!')}
// Eventos con delegación: funcionan para mouse, teclado, pantallas táctiles y botones de ayuda.
document.addEventListener('click',e=>{if(Date.now()<suppressClickUntil)return;const act=e.target.closest('[data-action]');if(act){handleAction(act.dataset);return}const item=e.target.closest('[data-item]');if(item){selectItem(Number(item.dataset.item));return}const zone=e.target.closest('[data-zone]');if(zone&&S.selected!=null)moveTo(zone.dataset.zone)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();S.selected=null;render()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-zone]')){e.preventDefault();if(S.selected!==null)moveTo(e.target.dataset.zone)}});
// Soporte de arrastrar y soltar con Pointer Events (incluye pantallas táctiles de iOS).
app.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-item]');if(!el||el.disabled||S.stage!=='arrange'||S.screen!=='game')return;const id=Number(el.dataset.item),obj=S.board.items.find(x=>x.id===id);if(!obj||obj.fixed)return;drag={id,from:obj.zone,x:e.clientX,y:e.clientY,moved:false,ghost:null,justDragged:false,pointerId:e.pointerId};});
document.addEventListener('pointermove',e=>{if(!drag||drag.pointerId!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>12){drag.moved=true;drag.ghost=document.createElement('div');drag.ghost.className='pointer-clone';drag.ghost.textContent=S.board.items.find(x=>x.id===drag.id).emoji;document.body.append(drag.ghost);}if(drag.moved){e.preventDefault();drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px';document.querySelectorAll('.zone-drag').forEach(x=>x.classList.remove('zone-drag'));const z=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-zone]');if(z)z.classList.add('zone-drag')}},{passive:false});
document.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;document.querySelectorAll('.zone-drag').forEach(x=>x.classList.remove('zone-drag'));if(d.ghost)d.ghost.remove();if(d.moved){const z=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-zone]');if(z){S.selected=d.id;moveTo(z.dataset.zone,d.id)}else{S.selected=d.id;render()}e.preventDefault();suppressClickUntil=Date.now()+450;}});
document.addEventListener('pointercancel',()=>{if(drag?.ghost)drag.ghost.remove();drag=null;});
// Evitar que un usuario cierre accidentalmente el panel tocando botones del fondo.
modalRoot.addEventListener('click',e=>{if(e.target.classList.contains('overlay'))closeModal()});
applyPrefs();render();
</script>
</body>
</html>
